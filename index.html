<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>gustavvasas-pluggsida V2</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@700&family=Raleway:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #999999;
      --line: #efefef;
      --field-bg: #fafafa;
      --field-border: #dddddd;
      --placeholder: #bbbbbb;
      --panel-bg: #ffffff;
      --card-size: 180px;
      --t: 0.45s; /* hur lång färgövergången är */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: 'Raleway', sans-serif;
      min-height: 100vh;
      padding: 0 0 60px 0;
      transition: background-color var(--t) ease;
    }

    /* ── HEADER ── */
    /* FIX: headern ligger över spelkorten, så inställningspanelen aldrig hamnar bakom dem */
    header {
      position: relative;
      z-index: 1000;
      padding: 48px 48px 32px 48px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .header-text { flex: 1; }

    h1 {
      font-family: 'EB Garamond', serif;
      font-size: clamp(2rem, 5vw, 3.6rem);
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .description {
      margin-top: 10px;
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: 0.88rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* ── SEARCH + SETTINGS BUTTON ── */
    .tools {
      flex-shrink: 0;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .tools input[type="text"] {
      width: 220px;
      padding: 9px 16px;
      border: 1.5px solid var(--field-border);
      border-radius: 6px;
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: 0.85rem;
      color: var(--fg);
      background: var(--field-bg);
      outline: none;
      transition: border-color var(--t) ease, background-color var(--t) ease, color var(--t) ease;
    }

    .tools input[type="text"]:focus { border-color: var(--muted); }
    .tools input[type="text"]::placeholder { color: var(--placeholder); }

    .gear-btn {
      width: 40px;
      height: 40px;
      border: 1.5px solid var(--field-border);
      border-radius: 6px;
      background: var(--field-bg);
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color var(--t) ease, background-color var(--t) ease,
                  transform 0.5s cubic-bezier(0.3, 1.5, 0.5, 1);
    }

    .gear-btn:hover { border-color: var(--muted); }
    .gear-btn[aria-expanded="true"] { transform: rotate(90deg); border-color: var(--muted); }
    .gear-btn:focus-visible, .reset-btn:focus-visible, .swatch:focus-visible {
      outline: 2px solid var(--muted);
      outline-offset: 2px;
    }

    /* ── SETTINGS PANEL ── */
    .settings-panel {
      position: absolute;
      top: 50px;
      right: 0;
      width: 272px;
      max-width: calc(100vw - 32px);
      padding: 20px;
      background: var(--panel-bg);
      border: 1.5px solid var(--field-border);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.14);
      z-index: 1001;

      /* stängd: osynlig, men kvar i layouten så den kan animeras */
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-8px) scale(0.96);
      transform-origin: top right;
      transition: opacity 0.2s ease,
                  transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                  visibility 0s linear 0.3s,
                  background-color var(--t) ease,
                  border-color var(--t) ease;
    }

    .settings-panel.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: none;
      transition-delay: 0s, 0s, 0s, 0s, 0s;
    }

    .settings-panel h2 {
      font-family: 'EB Garamond', serif;
      font-size: 1.2rem;
      color: var(--fg);
      margin-bottom: 14px;
    }

    .settings-panel label,
    .field-label {
      display: flex;
      justify-content: space-between;
      font-weight: 400;
      font-size: 0.78rem;
      color: var(--muted);
      margin: 16px 0 8px;
    }

    .field-label:first-of-type { margin-top: 0; }

    /* ── FÄRGKVADRAT ── */
    .sv-wrap {
      position: relative;
      width: 224px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
    }

    #sv {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      cursor: crosshair;
      touch-action: none;
    }

    #svDot {
      position: absolute;
      width: 16px;
      height: 16px;
      margin: -8px 0 0 -8px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      box-shadow: 0 0 0 1.5px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    input[type="range"] {
      width: 100%;
      height: 12px;
      border-radius: 6px;
      appearance: none;
      -webkit-appearance: none;
      background: #ddd;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #888;
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #888;
    }

    #hueRange {
      background: linear-gradient(to right,
        #f00 0%, #ff0 16.66%, #0f0 33.33%, #0ff 50%, #00f 66.66%, #f0f 83.33%, #f00 100%);
    }

    #sizeRange { background: var(--field-border); }

    .swatches { display: flex; gap: 10px; margin-top: 14px; }

    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid #bbb;
      cursor: pointer;
    }

    .reset-btn {
      margin-top: 18px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: transparent;
      font-family: 'Raleway', sans-serif;
      font-size: 0.8rem;
      color: var(--fg);
      cursor: pointer;
    }

    .reset-btn:hover { text-decoration: underline; }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: var(--line);
      margin: 0 48px 40px 48px;
    }

    /* ── GAME GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-size), 1fr));
      gap: 32px 28px;
      padding: 0 48px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
    }

    .game-card:hover .thumb { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.10); }

    .thumb {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 10px;
      background: #f0f0f0;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: block;
    }

    /* placeholder if no image */
    .thumb-placeholder {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 10px;
      background: #f3f3f3;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .thumb-placeholder span {
      font-size: 2.4rem;
      opacity: 0.25;
    }

    .game-card:hover .thumb-placeholder { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.10); }

    .game-title {
      margin-top: 10px;
      font-family: 'Raleway', sans-serif;
      font-weight: 400;
      font-size: var(--title-size, 0.82rem);
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.02em;
      line-height: 1.3;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    /* ── NO RESULTS ── */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: 0.9rem;
      color: var(--placeholder);
      padding: 60px 0;
    }

    @media (max-width: 600px) {
      header { flex-direction: column; padding: 32px 24px 24px; }
      .tools { width: 100%; }
      .tools input[type="text"] { flex: 1; width: auto; min-width: 0; }
      .settings-panel { right: 0; }
      .grid { padding: 0 24px; gap: 24px 20px; }
      .divider { margin: 0 24px 28px; }
    }

    /* ── ANIMATIONER ── */

    /* Kort övergång medan man drar i kvadraten/reglage, och ingen alls vid sidladdning */
    :root.dragging { --t: 0.06s; }
    :root.booting  { --t: 0s; }

    /* Texter och linjer byter färg mjukt (och spelnamnen växer/krymper mjukt) */
    h1, .description, .game-title, .no-results, .divider,
    .settings-panel h2, .settings-panel label, .field-label, .reset-btn {
      transition-property: color, background-color, border-color, font-size;
      transition-duration: var(--t);
      transition-timing-function: ease;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes draw {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    /* Vid sidladdning: rubrik, sök, linje och sedan spelen en efter en */
    .header-text { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .tools       { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.12s both; }
    .divider     { animation: draw 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s both; transform-origin: left; }

    .game-card.enter {
      animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      animation-delay: calc(min(var(--i, 0), 20) * 55ms + 300ms);
    }

    /* Vid sökning: träffarna tonas in snabbt */
    .game-card.fade { animation: fade 0.25s ease both; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-text">
      <h1>gustavvasas-pluggsida V2</h1>
      <p class="description">Om problem upstår kontakta: max.nydahl@edu.lomma.se</p>
    </div>
    <div class="tools">
      <input type="text" id="searchInput" placeholder="Sök spel..." />
      <button class="gear-btn" id="gearBtn" type="button" aria-label="Inställningar" aria-expanded="false" aria-controls="settingsPanel">⚙️</button>

      <div class="settings-panel" id="settingsPanel" role="dialog" aria-label="Inställningar">
        <h2>Inställningar</h2>

        <div class="field-label"><span>Bakgrundsfärg</span></div>
        <div class="sv-wrap">
          <canvas id="sv" width="448" height="448"></canvas>
          <div id="svDot"></div>
        </div>

        <div class="field-label"><span>Nyans</span></div>
        <input type="range" id="hueRange" min="0" max="360" value="0" />

        <div class="swatches">
          <button class="swatch" type="button" id="swWhite" style="background:#fff" aria-label="Vit"></button>
          <button class="swatch" type="button" id="swBlack" style="background:#000" aria-label="Svart"></button>
        </div>

        <label for="sizeRange"><span>Ikonstorlek</span><span id="sizeValue">180 px</span></label>
        <input type="range" id="sizeRange" min="110" max="320" step="10" value="180" />

        <button class="reset-btn" type="button" id="resetBtn">Återställ</button>
      </div>
    </div>
  </header>

  <div class="divider"></div>

  <div class="grid" id="gameGrid"></div>

  <script>
    // ============================================================
    //  LÄGG TILL SPEL HÄR
    //  Kopiera ett objekt och fyll i:
    //    title : namnet som visas under bilden
    //    url   : länken dit spelet går när man klickar
    //    image : sökväg/URL till bilden (lämna "" för platshållare)
    // ============================================================
    const GAMES = [
      {
        title: "Kill The Ice Age Baby 2",
        url:   "https://gustavvasas-pluggsida.github.io/Ice-age-baby-2/",
        image: "images/sddefault.jpg"   // sätt en bild-URL eller relativ sökväg, t.ex. "images/spel1.png"
      },
      {
        title: "DashMetry",
        url:   "https://gustavvasas-pluggsida.github.io/dash__metry/",
        image: "images/dashmetry-game3.png"
      },
      {
        title: "Bloons TD3",
        url:   "https://inkin6779.github.io/BloonsTD3/",
        image: "images/bloons-td-3-image.webp"
      },
      {
        title: "Bloons TD4",
        url:   "https://testingherokuapp.github.io/bloonstd4/",
        image: "images/bloons-tower-defense-4.jpg"
      },
      {
        title: "PixelGun 3D",
        url:   "https://feetlessfred.github.io/PixelGun3DGNMathPort/",
        image: "images/capsule_616x353.jpg"
      },
      {
        title: "ClusterRush",
        url:   "https://gamerluis43.github.io/ClusterRush/",
        image: "images/cluster-rush-game-icon-1.jpg"
      },
      {
        title: "Crossy Road",
        url:   "https://retro-circuit.github.io/crossy-roads/",
        image: "images/screenshot1-en.png"
      },
      {
        title: "Space Waves",
        url:   "https://deronics.github.io/SpaceWavesTest/",
        image: "images/maxresdefault.jpg"
      },
      {
        title: "Gorilla Tag",
        url:   "https://gustavvasas-pluggsida.github.io/gustavvasasgtag/",
        image: "images/header.jpg"
      },
      {
        title: "Mario Kart",
        url:   "https://fecolinhares.github.io/super-kart-3djs/",
        image: "images/mariokart8deluxe.webp"
      },
      {
        title: "Surströmming V2",
        url:   "https://sites.google.com/edu.lomma.se/surstrmmingv2/gizmos-n-gagets?authuser=0",
        image: "images/download.jpg"
      },
      {
        title: "Empire Tycoon",
        url:   "https://mrlundstrom.github.io/tycoon/",
        image: "images/Empire.png"
      },
      {
        title: "Ore RNG",
        url:   "https://gustavvasas-pluggsida.github.io/ore-rng/",
        image: "images/Diamond.png"
      },
      {
        title: "Minecarft",
        url:   "https://gustavvasas-pluggsida.github.io/minecraft/",
        image: "images/miencraft.jpg"
      },
      {
        title: "Anchors World",
        url:   "https://anchors-arcade.github.io/world/",
        image: "images/Anchors World.png"
      },
       {
        title: "Mouse Quest",
        url:   "https://kevinsurstromming-dev.github.io/musspel/",
        image: "images/Untitled design.png"
      },
    ];
    // ============================================================

    const grid        = document.getElementById('gameGrid');
    const searchInput = document.getElementById('searchInput');

    let firstRender = true; // bara första visningen får den "stegvisa" intoningen

    function renderGames(filter) {
      const q = (filter || '').toLowerCase();
      const filtered = GAMES.filter(g => g.title.toLowerCase().includes(q));
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = '<p class="no-results">Inga spel hittades.</p>';
        return;
      }

      filtered.forEach((game, idx) => {
        const a = document.createElement('a');
        a.className   = firstRender ? 'game-card enter' : 'game-card fade';
        a.style.setProperty('--i', idx);
        a.href        = game.url;
        a.target      = '_blank';
        a.rel         = 'noopener noreferrer';

        let media;
        if (game.image) {
          media = document.createElement('img');
          media.className = 'thumb';
          media.src       = game.image;
          media.alt       = game.title;
        } else {
          media = document.createElement('div');
          media.className = 'thumb-placeholder';
          media.innerHTML = '<span>🎮</span>';
        }

        const label = document.createElement('p');
        label.className   = 'game-title';
        label.textContent = game.title;

        a.appendChild(media);
        a.appendChild(label);
        grid.appendChild(a);
      });

      firstRender = false;
    }

    searchInput.addEventListener('input', () => renderGames(searchInput.value));
    renderGames();

    // ============================================================
    //  INSTÄLLNINGAR
    //  Färg lagras som HSV: h = nyans (0–360), s = mättnad (0–100), v = ljusstyrka (0–100)
    //  Kvadraten: åt höger = mer färg, uppåt = ljusare.
    //  Övre vänstra hörnet = vit, hela nedre kanten = svart.
    // ============================================================
    const DEFAULTS = { h: 0, s: 0, v: 100, size: 180 };
    let settings = Object.assign({}, DEFAULTS);

    try {
      const saved = JSON.parse(localStorage.getItem('pluggsida-settings'));
      if (saved) {
        // Gamla sparade inställningar använde HSL – räkna om dem till HSV
        if (saved.v === undefined && saved.l !== undefined) {
          const sl = (saved.s || 0) / 100, l = saved.l / 100;
          const v = l + sl * Math.min(l, 1 - l);
          saved.v = Math.round(v * 100);
          saved.s = v === 0 ? 0 : Math.round(2 * (1 - l / v) * 100);
          delete saved.l;
        }
        settings = Object.assign({}, DEFAULTS, saved);
      }
    } catch (e) {}

    const gearBtn   = document.getElementById('gearBtn');
    const panel     = document.getElementById('settingsPanel');
    const sv        = document.getElementById('sv');
    const svDot     = document.getElementById('svDot');
    const hueRange  = document.getElementById('hueRange');
    const sizeRange = document.getElementById('sizeRange');
    const sizeValue = document.getElementById('sizeValue');
    const root      = document.documentElement;

    function hsvToRgb(h, s, v) {
      s /= 100; v /= 100;
      const c = v * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = v - c;
      let r = 0, g = 0, b = 0;
      if (h < 60)       { r = c; g = x; }
      else if (h < 120) { r = x; g = c; }
      else if (h < 180) { g = c; b = x; }
      else if (h < 240) { g = x; b = c; }
      else if (h < 300) { r = x; b = c; }
      else              { r = c; b = x; }
      return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
    }

    // Rita färgkvadraten för vald nyans: vit → färg (vågrätt), sedan genomskinlig → svart (lodrätt)
    function drawSquare() {
      const ctx = sv.getContext('2d');
      const w = sv.width, h = sv.height;
      const [R, G, B] = hsvToRgb(settings.h, 100, 100);
      ctx.fillStyle = `rgb(${R},${G},${B})`;
      ctx.fillRect(0, 0, w, h);

      const white = ctx.createLinearGradient(0, 0, w, 0);
      white.addColorStop(0, '#fff');
      white.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = white;
      ctx.fillRect(0, 0, w, h);

      const black = ctx.createLinearGradient(0, 0, 0, h);
      black.addColorStop(0, 'rgba(0,0,0,0)');
      black.addColorStop(1, '#000');
      ctx.fillStyle = black;
      ctx.fillRect(0, 0, w, h);
    }

    let lastDrawnHue = null;

    function applySettings() {
      const { h, s, v, size } = settings;
      const [R, G, B] = hsvToRgb(h, s, v);

      // Bakgrundens faktiska ljushet, så att text alltid syns (svart bg → vit text osv.)
      const lin = [R, G, B].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      const lum  = 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
      const dark = lum < 0.179;

      root.style.setProperty('--bg', `rgb(${R}, ${G}, ${B})`);
      root.style.setProperty('--card-size', size + 'px');

      // Textstorlek följer ikonstorleken (0.82rem vid 180 px)
      const titleSize = Math.max(0.7, Math.min(1.4, 0.82 * size / 180));
      root.style.setProperty('--title-size', titleSize.toFixed(2) + 'rem');

      root.style.setProperty('--fg',           dark ? '#ffffff' : '#111111');
      root.style.setProperty('--muted',        dark ? 'rgba(255,255,255,0.82)' : 'rgba(0,0,0,0.68)');
      root.style.setProperty('--line',         dark ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.12)');
      root.style.setProperty('--field-bg',     dark ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.7)');
      root.style.setProperty('--field-border', dark ? 'rgba(255,255,255,0.32)' : 'rgba(0,0,0,0.2)');
      root.style.setProperty('--placeholder',  dark ? 'rgba(255,255,255,0.55)' : 'rgba(0,0,0,0.45)');
      root.style.setProperty('--panel-bg',     dark ? '#222222' : '#ffffff');

      // Rita om kvadraten bara när nyansen ändrats
      if (lastDrawnHue !== h) { drawSquare(); lastDrawnHue = h; }

      hueRange.value = h;
      sizeRange.value = size;
      sizeValue.textContent = size + ' px';

      // Placera pricken i kvadraten (i procent, så den följer med om kvadraten skalas)
      svDot.style.left = s + '%';
      svDot.style.top  = (100 - v) + '%';

      try { localStorage.setItem('pluggsida-settings', JSON.stringify(settings)); } catch (e) {}
    }

    // Välj färg i kvadraten
    function pickFromSquare(e) {
      const rect = sv.getBoundingClientRect();
      const x = Math.max(0, Math.min(rect.width,  e.clientX - rect.left));
      const y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
      settings.s = Math.round((x / rect.width) * 100);
      settings.v = Math.round((1 - y / rect.height) * 100);
      applySettings();
    }

    let dragging = false;
    sv.addEventListener('pointerdown', e => {
      dragging = true;
      sv.setPointerCapture(e.pointerId);
      pickFromSquare(e);
    });
    sv.addEventListener('pointermove', e => { if (dragging) pickFromSquare(e); });
    sv.addEventListener('pointerup',     () => { dragging = false; });
    sv.addEventListener('pointercancel', () => { dragging = false; });

    hueRange.addEventListener('input', () => {
      settings.h = Number(hueRange.value);
      // Om man står på ren vit/svart och drar nyansen: ge lite färg så man ser skillnad
      if (settings.s === 0) settings.s = 100;
      if (settings.v === 0) settings.v = 100;
      applySettings();
    });

    sizeRange.addEventListener('input', () => {
      settings.size = Number(sizeRange.value);
      applySettings();
    });

    document.getElementById('swWhite').addEventListener('click', () => {
      settings.s = 0; settings.v = 100;
      applySettings();
    });
    document.getElementById('swBlack').addEventListener('click', () => {
      settings.s = 0; settings.v = 0;
      applySettings();
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      settings = Object.assign({}, DEFAULTS);
      applySettings();
    });

    // Öppna / stäng panelen
    function setPanel(open) {
      panel.classList.toggle('open', open);
      gearBtn.setAttribute('aria-expanded', String(open));
    }

    gearBtn.addEventListener('click', e => {
      e.stopPropagation();
      setPanel(!panel.classList.contains('open'));
    });
    panel.addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => setPanel(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setPanel(false); });

    // Medan man drar i kvadraten eller ett reglage följer färgen direkt (ingen släpning)
    panel.addEventListener('pointerdown', () => root.classList.add('dragging'));
    document.addEventListener('pointerup',     () => root.classList.remove('dragging'));
    document.addEventListener('pointercancel', () => root.classList.remove('dragging'));

    // Sparade färger sätts utan övergång vid sidladdning, så ingen vit blixt syns
    root.classList.add('booting');
    applySettings();
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('booting')));
  </script>
</body>
</html>
